version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region eu-central-1 | docker login --username AWS --password-stdin 340529311521.dkr.ecr.eu-central-1.amazonaws.com
  build:
    commands:
      - docker build -t shapelid-kernel kernel_service/
      - docker tag shapelid-kernel:latest 340529311521.dkr.ecr.eu-central-1.amazonaws.com/shapelid-kernel:latest
  post_build:
    commands:
      - docker push 340529311521.dkr.ecr.eu-central-1.amazonaws.com/shapelid-kernel:latest
